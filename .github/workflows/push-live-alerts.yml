name: Live match push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Relancer /api/push-kickoff
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Ajoute le secret GitHub CRON_SECRET (même valeur que Vercel) pour les notifs buts app fermée."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "https://talk-foot.com/api/push-kickoff"
