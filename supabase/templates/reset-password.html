<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk Foot — Réinitialise ton mot de passe</title>
</head>
<body style="margin:0;padding:0;background:#041424;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:linear-gradient(180deg,#041424 0%,#061a2e 100%);padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <div style="display:inline-block;background:#ffffff;border-radius:16px;padding:12px 18px;border:2px solid rgba(255,255,255,0.18);">
                <img src="{{ .SiteURL }}/logo-talk-foot.png" alt="Talk Foot" width="148" style="display:block;height:auto;border:0;" />
              </div>
            </td>
          </tr>
          <tr>
            <td style="background:#0a223a;border:1px solid rgba(125,211,252,0.22);border-radius:20px;padding:28px 24px 24px;">
              <p style="margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#7dd3fc;">Talk Foot</p>
              <h1 style="margin:0 0 14px;font-size:26px;line-height:1.15;font-weight:900;color:#f8fafc;">Nouveau mot de passe</h1>
              <p style="margin:0 0 22px;font-size:15px;line-height:1.55;font-weight:600;color:#cbd5e1;">
                Nous avons reçu une demande de réinitialisation de ton mot de passe. Si tu es à l'origine de cette demande, clique ci-dessous.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 22px;">
                <tr>
                  <td align="center" style="border-radius:14px;background:#ff3b3b;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 24px;font-size:15px;font-weight:800;color:#ffffff;text-decoration:none;border-radius:14px;">Choisir un mot de passe</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:11px;line-height:1.5;font-weight:600;color:#64748b;">
                Tu n'as rien demandé ? Ignore cet email, ton mot de passe reste inchangé.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
